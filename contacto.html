<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EasyTech | Contacto</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<header>

    <div class="contenedor encabezado">

        <a href="index.html" class="logo">EasyTech</a>

        <nav>

            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="consejos.html">Consejos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>

        </nav>

    </div>

</header>


<main>

<section class="seccion">

<div class="contenedor">

    <h1>Contacto</h1>

    <p class="subtitulo">
        Déjanos tu mensaje y nos pondremos en contacto contigo.
    </p>


    <form id="formularioContacto">

        <label for="nombre">
            Nombre
        </label>

        <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre"
        >


        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            placeholder="ejemplo@correo.com"
        >


        <label for="asunto">
            Asunto
        </label>

        <input
            type="text"
            id="asunto"
            placeholder="Motivo del mensaje"
        >


        <label for="mensaje">
            Mensaje
        </label>

        <textarea
            id="mensaje"
            rows="6"
            placeholder="Escribe tu mensaje">
        </textarea>


        <button type="submit" class="boton">
            Enviar mensaje
        </button>

    </form>

</div>

</section>

</main>


<footer>

<div class="contenedor">

<p>© 2026 EasyTech - Tecnología al alcance de todos</p>

</div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
